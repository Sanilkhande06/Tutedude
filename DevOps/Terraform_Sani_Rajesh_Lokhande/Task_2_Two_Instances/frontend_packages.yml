---
- name: Setup Application Folder and Git Repository
  hosts: webservers
  become: true
  vars:
    # Update these values with your actual details
    repo_url: "https://github.com/Sanilkhande06/Tutedude.git"
    app_dir: "/home/ubuntu/student_app"
    frontend_app_dir: "/home/ubuntu/student_app/DevOps/Jenkins_CICD_Sani_Rajesh_Lokhande/frontend"

  tasks:

    # 1. INSTALL SYSTEM PACKAGES
    - name: Update apt cache and install Core System Packages
      ansible.builtin.apt:
        name:
          - git
          - nodejs
          - npm
        state: present
        update_cache: true

    # Clean old deployment directory
    - name: Clean old deployment directory
      ansible.builtin.file:
        path: "{{ frontend_app_dir }}"
        state: absent

    # 2. CREATE APPLICATION DIRECTORY
    - name: Ensure the application directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    # 3. PULL GIT REPOSITORY
    - name: Clone the Git repository into the application folder
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main # Change to your default branch name (e.g., master)
        force: yes

    # FORCE EXPLICIT GIT PULL
    - name: Force git fetch and pull from origin main
      ansible.builtin.shell: |
        git fetch --all
        git reset --hard origin/main
      args:
        chdir: "{{ frontend_app_dir }}"
    
    # 7. INSTALL PM2 GLOBALLY
    - name: Install PM2 globally via NPM
      community.general.npm:
        name: pm2
        global: yes
        state: present

    # INSTALL DOTENV IN EXPRESS APP DIRECTORY
    - name: Install dotenv package inside frontend directory
      community.general.npm:
        name: dotenv
        path: "{{ frontend_app_dir }}"
        state: present
    
    # NEW: CREATE OR OVERWRITE .ENV FILE DYNAMICALLY BEFORE RUNNING THE APP
    - name: Dynamically write frontend .env file configurations
      ansible.builtin.copy:
        dest: "{{ frontend_app_dir }}/.env"
        mode: '0600' # Restricts file permissions for security reasons
        content: |
          BACKEND_HOST=16.171.199.210
          BACKEND_PORT=5000

    # 8. START/RESTART THE FRONTEND APPLICATION WITH PM2
    - name: Ensure the Frontend app is running under PM2
      ansible.builtin.shell: |
        pm2 start npm --name "frontend-app" -- start
      args:
        chdir: "{{ frontend_app_dir }}"
      environment:
        NODE_ENV: production