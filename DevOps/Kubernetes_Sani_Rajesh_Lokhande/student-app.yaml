apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-backend
  labels:
    app: student-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-backend
  template:
    metadata:
      labels:
        app: student-backend
    spec:
      containers:
      - name: backend-container
        image: kubernetes_sani_rajesh_lokhande-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: student-backend
spec:
  type: NodePort  
  ports:
  - port: 4000
    targetPort: 4000 
    nodePort: 31000
  selector:
    app: student-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-frontend
  labels:
    app: student-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-frontend
  template:
    metadata:
      labels:
        app: student-frontend
    spec:
      containers:
      - name: frontend-container
        image: kubernetes_sani_rajesh_lokhande-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: BACKEND_URL
          value: "http://student-backend:4000/students"
---
apiVersion: v1
kind: Service
metadata:
  name: student-frontend
spec:
  type: NodePort    
  ports:
  - port: 3000
    targetPort: 3000   
    nodePort: 32000  
  selector:
    app: student-frontend
