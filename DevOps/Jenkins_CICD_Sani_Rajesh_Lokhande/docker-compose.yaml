version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    hostname: backend_host
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
    networks:
      - student_network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules 
      - ./frontend:/app
    environment:
      - BACKEND_HOST=backend_host
      - BACKEND_PORT=4000
    links:
      - backend
    depends_on:
      - backend
    networks:
      - student_network

networks:
  student_network:
    driver: bridge